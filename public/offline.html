<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nossas Finanças - sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .caixa { max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #475569; line-height: 1.5; margin: 0 0 8px; font-size: 15px; }
      button {
        margin-top: 20px;
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 15px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="caixa">
      <img src="/icone-192.png" alt="" />
      <h1>Sem conexão com o servidor</h1>
      <p>
        O app guarda tudo no computador de casa. Confira se aquele PC está
        ligado e se você está na mesma rede wifi.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
