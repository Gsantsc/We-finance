<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>We Finance - sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4efe4;
        color: #22241f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .caixa { max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 8px; color: #1c3a31; }
      p { color: #8a9b8e; line-height: 1.5; margin: 0 0 8px; font-size: 15px; }
      button {
        margin-top: 20px;
        background: #1c3a31;
        color: #fbf8f1;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="caixa">
      <img src="/icone-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>
        Não foi possível falar com o servidor. Confira sua internet e tente
        de novo.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
